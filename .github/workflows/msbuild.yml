---
# MSBuild CI/CD for the ygordreyer/moonlight-xbox-plus fork.
#
# This is a rework of the upstream TheElixZammuto/moonlight-xbox workflow of
# the same name, kept close to the original step order but with the
# following fork-specific additions:
#
#   - Broader push triggers (main, baseline/**, experiment/**, feature/**,
#     ci/**) so working branches get CI without needing a PR, plus a
#     workflow_dispatch with a "deploy" toggle and a free-form "ref_note".
#   - A version-stamping step that rewrites Package.appxmanifest's
#     Identity/Version to <major>.<minor>.<run_number>.0 so every build
#     produced by this workflow carries a unique, traceable version.
#   - A cache around the two from-source vcpkg installed-trees produced by
#     generate-thirdparty-projects.bat (moonlight-common-c and
#     libgamestream each configure+build their own vcpkg manifest install,
#     separate from the prebuilt vcpkg_installed.zip restored below), plus
#     vcpkg's download cache, to avoid rebuilding the same third-party
#     dependencies from source on every run.
#   - A step that adds the Windows SDK bin\10.0.*\x64 directory to PATH so
#     fxc.exe (the D3D shader compiler needed by the main solution build)
#     is resolvable.
#   - Certificate handling is redesigned around a real fork-owned signing
#     secret (secrets.SIGNING_PFX_BASE64, optionally paired with
#     secrets.SIGNING_PFX_PASSWORD) instead of upstream's two
#     repository-identity-gated steps (one for a PR from a fork, one for
#     push/PR from TheElixZammuto/moonlight-xbox), which do not apply to a
#     fork whose canonical remote is not TheElixZammuto's. When the signing
#     secret is not configured (for example a PR from an external fork,
#     which cannot see this repo's secrets anyway, or a fresh clone before
#     secrets are set up) an ephemeral self-signed certificate is generated
#     instead, so the build still produces a sideloadable package.
#   - A build-info.json written into the output directory after msbuild
#     runs, recording the stamped version, run metadata, and the dispatch
#     ref_note (if any).
#   - A new "deploy" job on a self-hosted xbox-lan runner that installs the
#     freshly built package onto a paired Xbox Dev Mode console via
#     tools/xbox-deploy.ps1 (Windows Device Portal REST API). It only runs
#     for non-PR events on this fork's own repository, and additionally
#     respects the deploy input when triggered via workflow_dispatch. Xbox
#     console credentials never pass through the workflow: they live only
#     in a local credentials.json on the xbox-lan runner, which
#     tools/xbox-deploy.ps1 reads directly (see that script's own header
#     comment for the full resolution order and soft-fail behavior).
name: MSBuild

on:
  push:
    branches:
      - main
      - 'baseline/**'
      - 'experiment/**'
      - 'feature/**'
      - 'ci/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the built package to the Xbox dev console after a successful build'
        type: boolean
        default: true
      ref_note:
        description: 'Free-form note describing why this run was triggered (recorded in build-info.json)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: .  # Path to the solution file relative to the root of the project.
  BUILD_CONFIGURATION: Release  # Configuration type to build.

jobs:
  build:
    # TEMPORARY: the account billing lock refuses hosted jobs; revert to windows-2022 once https://github.com/settings/billing is unlocked and one hosted run is green (docs/PLAN.md section 6.6)
    runs-on: [self-hosted, xbox-lan]
    env:
      # secrets is not a valid context inside if:; surface the presence of
      # the signing secret as a job env string and test that instead.
      HAS_SIGNING_PFX: ${{ secrets.SIGNING_PFX_BASE64 != '' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Stamp package version
      shell: pwsh
      run: |
        $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'Package.appxmanifest'
        $manifest = Get-Content -Path $manifestPath -Raw

        # Anchor on a preceding whitespace char so this can only match the
        # standalone Identity/Version attribute, never the tail of
        # MinVersion="..." / MaxVersionTested="...".
        $versionPattern = '(?<=\s)Version="\d+\.\d+\.\d+\.\d+"'
        $found = [regex]::Matches($manifest, $versionPattern)
        if ($found.Count -ne 1) {
          throw "Expected exactly one standalone Version attribute in $manifestPath, found $($found.Count)"
        }

        if (-not ($manifest -match '(?<=\s)Version="(\d+)\.(\d+)\.\d+\.\d+"')) {
          throw "Could not parse major/minor out of the Version attribute in $manifestPath"
        }
        $major = $Matches[1]
        $minor = $Matches[2]

        $runNumber = $env:GITHUB_RUN_NUMBER
        $newVersion = "$major.$minor.$runNumber.0"

        $updated = [regex]::Replace($manifest, $versionPattern, ('Version="' + $newVersion + '"'))
        Set-Content -Path $manifestPath -Value $updated -NoNewline -Encoding utf8BOM

        Write-Host "Stamped $manifestPath version to $newVersion"
        "PACKAGE_VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Restore VCPKG packages
      run: |
        Invoke-WebRequest `
          -Uri "https://github.com/TheElixZammuto/moonlight-xbox/releases/download/1.10.0/vcpkg_installed.zip" `
          -OutFile .\vcpkg_installed.zip

    - name: Extract VCPKG packages
      run: Expand-Archive .\vcpkg_installed.zip -DestinationPath .\

    - name: List VCPKG packages
      run: dir .\vcpkg_installed

    - name: Install VCPKG packages
      run: .\vcpkg\bootstrap-vcpkg.bat

    - name: Cache vcpkg from-source builds
      uses: actions/cache@v4
      with:
        path: |
          third_party/moonlight-common-c/build/vcpkg_installed
          libgamestream/build/vcpkg_installed
          vcpkg/downloads
        # generate-thirdparty-projects.bat points both sub-builds'
        # VCPKG_MANIFEST_DIR at the single repo-root vcpkg.json (../.. from
        # third_party/moonlight-common-c, .. from libgamestream), so that
        # root manifest is what determines their installed contents; the
        # batch file itself is hashed too since its CMake flags (triplet,
        # UWP target) also shape the installed tree.
        key: vcpkg-fromsource-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'generate-thirdparty-projects.bat') }}
        restore-keys: |
          vcpkg-fromsource-${{ runner.os }}-

    - name: Build third party tools
      run: .\generate-thirdparty-projects.bat

    - name: Set up NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Add Windows SDK bin directory to PATH (fxc.exe)
      shell: pwsh
      run: |
        $onPath = Get-Command fxc.exe -ErrorAction SilentlyContinue
        if ($onPath) { Write-Host "fxc.exe already on PATH: $($onPath.Source)"; exit 0 }
        # Kit root from the registry first (a self-hosted machine can keep the SDK on any drive), hosted-runner literal last.
        $roots = @(
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -ErrorAction SilentlyContinue).KitsRoot10,
          (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots' -ErrorAction SilentlyContinue).KitsRoot10,
          (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\Windows\v10.0' -ErrorAction SilentlyContinue).InstallationFolder,
          'C:\Program Files (x86)\Windows Kits\10\'
        ) | Where-Object { $_ } | Select-Object -Unique
        $fxcDir = $null
        foreach ($root in $roots) {
          $bin = Join-Path $root 'bin'
          if (-not (Test-Path $bin)) { continue }
          $candidate = Get-ChildItem -Path $bin -Directory -Filter '10.0.*' |
            Where-Object { Test-Path (Join-Path $_.FullName 'x64\fxc.exe') } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($candidate) { $fxcDir = Join-Path $candidate.FullName 'x64'; break }
        }
        if (-not $fxcDir) { throw "fxc.exe not found under any Windows SDK root: $($roots -join '; ')" }
        Write-Host "Adding $fxcDir to PATH"
        Add-Content -Path $env:GITHUB_PATH -Value $fxcDir

    - name: Load signing certificate (repo secret)
      id: cert
      if: env.HAS_SIGNING_PFX == 'true'
      shell: pwsh
      env:
        SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      run: |
        $bytes = [System.Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
        [System.IO.File]::WriteAllBytes('cert.pfx', $bytes)
        Get-FileHash -Path cert.pfx
        # The pfx password is NOT passed on as a step output: the runner drops
        # any output whose value contains a masked secret. The Build step reads
        # secrets.SIGNING_PFX_PASSWORD from its own env instead.

    - name: Generate ephemeral self-signed certificate
      id: certtmp
      if: steps.cert.outcome == 'skipped'
      shell: pwsh
      run: |
        # No SIGNING_PFX_BASE64 secret is configured (for example a PR from
        # an external fork, which cannot see this repo's secrets regardless,
        # or a fresh clone before secrets are set up). Fall back to a
        # throwaway self-signed certificate so the build still produces a
        # sideloadable package; it will not match the Publisher's real
        # signing identity.
        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=CE07B73A-712E-4E05-932B-D08CE2C8A87C" `
          -KeyUsage DigitalSignature `
          -FriendlyName "MoonlightUWP (ephemeral CI)" `
          -CertStoreLocation "Cert:\LocalMachine\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

        # Throwaway password for a throwaway cert. Deliberately NOT masked:
        # the runner drops outputs and env values that contain a masked
        # string, which would leave the Build step with an empty password.
        $password = [System.Guid]::NewGuid().ToString("N")

        Export-PfxCertificate `
          -Cert Cert:\LocalMachine\My\$($cert.Thumbprint) `
          -FilePath cert.pfx `
          -Password (ConvertTo-SecureString -String $password -AsPlainText -Force)
        Get-FileHash -Path cert.pfx

        "EPHEMERAL_PFX_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Build
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      shell: pwsh
      env:
        SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
      run: |
        # Exactly one of the two certificate steps above runs. The ephemeral
        # step exports EPHEMERAL_PFX_PASSWORD via GITHUB_ENV; the repo-secret
        # path reads the secret straight from this step's env, because a
        # masked value cannot travel through step outputs.
        $certPassword = if ($env:EPHEMERAL_PFX_PASSWORD) { $env:EPHEMERAL_PFX_PASSWORD } else { $env:SIGNING_PFX_PASSWORD }
        # An unset env var reads as $null, and ($null -ne "") is True in
        # PowerShell; coerce so the emptiness check below stays meaningful.
        $certPassword = [string]$certPassword

        # if certPassword is not empty, use it
        if ($certPassword -ne "") {
          $certPasswordArg = "/p:PackageCertificatePassword=$certPassword"
        }
        else {
          $certPasswordArg = ""
        }

        # moonlight-xbox-dx.vcxproj hardcodes PackageCertificateThumbprint to
        # a specific signing cert's thumbprint; override it here to match
        # whichever certificate cert.pfx actually holds (fork secret or
        # ephemeral), otherwise msbuild fails at
        # Microsoft.AppXPackage.Targets with "Certificate does not match
        # supplied signing thumbprint".
        $pfxPath = (Resolve-Path 'cert.pfx').Path
        $thumb = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, $certPassword).Thumbprint
        Write-Host "Signing with certificate thumbprint $thumb"

        msbuild /m `
          /p:Configuration=${{env.BUILD_CONFIGURATION}} `
          /p:AppxBundle=Always `
          /p:AppxPackageDir=output `
          /p:PackageCertificateKeyFile=cert.pfx `
          /p:UapAppxPackageBuildMode=SideLoadOnly `
          /p:PackageCertificateThumbprint=$thumb `
          $certPasswordArg `
          ${{env.SOLUTION_FILE_PATH}}

    - name: Write build metadata
      shell: pwsh
      run: |
        $info = [ordered]@{
          version       = $env:PACKAGE_VERSION
          runId         = $env:GITHUB_RUN_ID
          runNumber     = $env:GITHUB_RUN_NUMBER
          sha           = $env:GITHUB_SHA
          ref           = $env:GITHUB_REF
          eventName     = $env:GITHUB_EVENT_NAME
          refNote       = '${{ inputs.ref_note }}'
          builtAt       = (Get-Date).ToUniversalTime().ToString("o")
          configuration = $env:BUILD_CONFIGURATION
        }
        New-Item -ItemType Directory -Path output -Force | Out-Null
        $info | ConvertTo-Json | Set-Content -Path output/build-info.json -Encoding utf8
        Get-Content output/build-info.json

    - name: Clean Certificate
      if: always()  # clean up, even if build fails
      run: |
        if(test-path cert.pfx){
          Remove-Item -path cert.pfx
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: moonlight-uwp
        path: |
          output
        if-no-files-found: error
        retention-days: 30

  deploy:
    name: Deploy to Xbox dev console
    needs: build
    runs-on: [self-hosted, xbox-lan]
    # Bounds run time only, never queue time: a job waiting for an offline
    # runner sits queued regardless. Check runner status before dispatching.
    timeout-minutes: 30
    # Only this fork's own repository owns an xbox-lan runner; never attempt
    # this job on a PR (including same-repo PRs) or on a fork-of-the-fork.
    # On workflow_dispatch, additionally require the deploy input.
    if: >-
      github.repository == 'ygordreyer/moonlight-xbox-plus' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy == true)
    concurrency:
      # There is exactly one physical console behind the xbox-lan runner;
      # serialize deploys across branches instead of letting them race.
      group: xbox-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout (for tools/xbox-deploy.ps1)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: moonlight-uwp
          path: artifact

      - name: Deploy to Xbox
        shell: pwsh
        run: |
          ./tools/xbox-deploy.ps1 `
            -ArtifactDir artifact `
            -OutputDir deploy-out `
            -Launch `
            -Screenshot

      - name: Upload deploy output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-out
          path: deploy-out
          if-no-files-found: warn
          retention-days: 30
