name: Runner probe

on:
  workflow_dispatch:
  push:
    branches: [ 'ci/runner-probe' ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, xbox-lan]
    timeout-minutes: 5
    steps:
      - name: Say hello from the runner
        shell: pwsh
        run: Write-Host "probe ok on $env:COMPUTERNAME"
